name: Fetch Saxo Positions

on:
  workflow_dispatch: # Manual trigger only

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Decrypt tokens
        env:
          TOKENS_PASSPHRASE: ${{ secrets.TOKENS_PASSPHRASE }}
        run: python scripts/decrypt_tokens.py

      - name: Fetch positions
        env:
          SAXO_APP_KEY: ${{ secrets.SAXO_APP_KEY }}
          SAXO_APP_SECRET: ${{ secrets.SAXO_APP_SECRET }}
        run: python scripts/fetch_positions.py

      - name: Re-encrypt tokens (in case they were refreshed)
        env:
          TOKENS_PASSPHRASE: ${{ secrets.TOKENS_PASSPHRASE }}
        run: python encrypt_tokens.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/positions.json tokens_live.json.enc
          git diff --staged --quiet || git commit -m "Update portfolio data"
          git push
